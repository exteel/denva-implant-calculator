name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild (ТЗ §11.4): city pages, the static price blocks, JSON-LD and
  # sitemap.xml are generated at build time from Supabase (get_city_pages), so a
  # new published aggregate or a changed city status goes live within a day.
  # Scheduled runs use the default branch; GitHub pauses them after 60 days
  # without repository activity (re-enable in the Actions tab if that happens).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc --noEmit -p supabase/tsconfig.json
      - run: node scripts/sync-engine.mjs --check
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /denva-implant-calculator
          # Public by design (access is enforced by RLS). Set them in
          # GitHub → Settings → Secrets and variables → Actions → Variables.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
